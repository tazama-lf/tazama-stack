[couchdb]
single_node=true

[httpd]
enable_cors = true
max_http_request_size = 4294967296

[cors]
origins = *
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, x-csrf-token

[log]
level = info

[chttpd]
bind_address = 0.0.0.0
port = 5984

# The admin account ([admins]) and the cookie secret ([chttpd_auth] secret)
# come from TAZAMA_COUCHDB_* in extensions/secrets.env; the couchdb image
# writes them into local.d/docker.ini at container start.
