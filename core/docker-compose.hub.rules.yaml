# Shared client credentials; the CA signing key and server key stay off application containers.
x-nats-client-volumes: &nats-client-volumes
  - type: bind
    source: ${NATS_CERTS_DIR:-./nats/certs}/client
    target: /etc/nats/client
    read_only: true
    bind:
      create_host_path: false

# For local testing
services:
  rule-901:
    container_name: rule-901
    image: tazamaorg/rule-901:${TAZAMA_VERSION}
    env_file:
      - env/rule-901.env
      - .env
    environment:
      - CONFIGURATION_DATABASE_USER=postgres
      - CONFIGURATION_DATABASE_PASSWORD=${TAZAMA_CORE_PG_PASSWORD:?set it in core/secrets.env}
      - EVENT_HISTORY_DATABASE_USER=postgres
      - EVENT_HISTORY_DATABASE_PASSWORD=${TAZAMA_CORE_PG_PASSWORD:?set it in core/secrets.env}
      - RAW_HISTORY_DATABASE_USER=postgres
      - RAW_HISTORY_DATABASE_PASSWORD=${TAZAMA_CORE_PG_PASSWORD:?set it in core/secrets.env}
    volumes: *nats-client-volumes
    restart: always
    depends_on:
      valkey:
        condition: service_started
      core-postgres:
        condition: service_healthy

  rule-902:
    container_name: rule-902
    image: tazamaorg/rule-902:${TAZAMA_VERSION}
    env_file:
      - env/rule-902.env
      - .env
    environment:
      - CONFIGURATION_DATABASE_USER=postgres
      - CONFIGURATION_DATABASE_PASSWORD=${TAZAMA_CORE_PG_PASSWORD:?set it in core/secrets.env}
      - EVENT_HISTORY_DATABASE_USER=postgres
      - EVENT_HISTORY_DATABASE_PASSWORD=${TAZAMA_CORE_PG_PASSWORD:?set it in core/secrets.env}
      - RAW_HISTORY_DATABASE_USER=postgres
      - RAW_HISTORY_DATABASE_PASSWORD=${TAZAMA_CORE_PG_PASSWORD:?set it in core/secrets.env}
    volumes: *nats-client-volumes
    restart: always
    depends_on:
      valkey:
        condition: service_started
      core-postgres:
        condition: service_healthy
