# Source and destination client credentials for TLS-enabled NATS brokers.
x-nats-client-volumes: &nats-client-volumes
  - type: bind
    source: ${NATS_CERTS_DIR:-./nats/certs}/client
    target: /etc/nats/client
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${DESTINATION_NATS_CERTS_DIR:-${NATS_CERTS_DIR:-./nats/certs}/client}
    target: /etc/nats/destination
    read_only: true
    bind:
      create_host_path: false

services:
  event-flow:
    environment:
      SUPPRESS_ALERTS: false
      INTERDICTION_DESTINATION: tenant
      INTERDICTION_PRODUCER: interdiction-service-ef

  typology-processor:
    environment:
      SUPPRESS_ALERTS: false
      INTERDICTION_DESTINATION: tenant
      INTERDICTION_PRODUCER: interdiction-service-tp

  event-adjudicator:
    environment:
      SUPPRESS_ALERTS: false
      ALERT_DESTINATION: tenant
      ALERT_PRODUCER: investigation-service
      ALERTS_ONLY: true

  relay-service-ef-tenant-001:
    container_name: relay-service-ef-tenant-001
    image: tazamaorg/relay-service-integration-nats:${TAZAMA_VERSION}
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    restart: always
    environment:
      FUNCTION_NAME: relay-service-ef-tenant-001
      CONSUMER_STREAM: interdiction-service-ef-tenant-001
      PRODUCER_STREAM: relay-service-nats-ef-tenant-001
      APM_SERVICE_NAME: relay-service-ef-tenant-001
    depends_on:
      - event-flow

  relay-service-ef-tenant-002:
    container_name: relay-service-ef-tenant-002
    image: tazamaorg/relay-service-integration-nats:${TAZAMA_VERSION}
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    restart: always
    environment:
      FUNCTION_NAME: relay-service-ef-tenant-002
      CONSUMER_STREAM: interdiction-service-ef-tenant-002
      PRODUCER_STREAM: relay-service-nats-ef-tenant-002
      APM_SERVICE_NAME: relay-service-ef-tenant-002
    depends_on:
      - event-flow

  relay-service-tp-tenant-001:
    container_name: relay-service-tp-tenant-001
    image: tazamaorg/relay-service-integration-nats:${TAZAMA_VERSION}
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    restart: always
    environment:
      FUNCTION_NAME: relay-service-tp-tenant-001
      CONSUMER_STREAM: interdiction-service-tp-tenant-001
      PRODUCER_STREAM: relay-service-nats-tp-tenant-001
      APM_SERVICE_NAME: relay-service-tp-tenant-001
    depends_on:
      - typology-processor

  relay-service-tp-tenant-002:
    container_name: relay-service-tp-tenant-002
    image: tazamaorg/relay-service-integration-nats:${TAZAMA_VERSION}
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    restart: always
    environment:
      FUNCTION_NAME: relay-service-tp-tenant-002
      CONSUMER_STREAM: interdiction-service-tp-tenant-002
      PRODUCER_STREAM: relay-service-nats-tp-tenant-002
      APM_SERVICE_NAME: relay-service-tp-tenant-002
    depends_on:
      - typology-processor

  relay-service-ea-tenant-001:
    container_name: relay-service-ea-tenant-001
    image: tazamaorg/relay-service-integration-nats:${TAZAMA_VERSION}
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    restart: always
    environment:
      FUNCTION_NAME: relay-service-ea-tenant-001
      CONSUMER_STREAM: investigation-service-tenant-001
      PRODUCER_STREAM: relay-service-nats-ea-tenant-001
      APM_SERVICE_NAME: relay-service-ea-tenant-001
    depends_on:
      - event-adjudicator

  relay-service-ea-tenant-002:
    container_name: relay-service-ea-tenant-002
    image: tazamaorg/relay-service-integration-nats:${TAZAMA_VERSION}
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    restart: always
    environment:
      FUNCTION_NAME: relay-service-ea-tenant-002
      CONSUMER_STREAM: investigation-service-tenant-002
      PRODUCER_STREAM: relay-service-nats-ea-tenant-002
      APM_SERVICE_NAME: relay-service-ea-tenant-002
    depends_on:
      - event-adjudicator