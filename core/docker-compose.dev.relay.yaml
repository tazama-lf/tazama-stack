# Source and destination client credentials for TLS-enabled NATS brokers.
x-nats-client-volumes: &nats-client-volumes
  - type: bind
    source: ${NATS_CERTS_DIR:-./nats/certs}/client
    target: /etc/nats/client
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${DESTINATION_NATS_CERTS_DIR:-${NATS_CERTS_DIR:-./nats/certs}/client}
    target: /etc/nats/destination
    read_only: true
    bind:
      create_host_path: false

services:
  event-flow:
    environment:
      SUPPRESS_ALERTS: false
      INTERDICTION_DESTINATION: global
      INTERDICTION_PRODUCER: interdiction-service-ef

  typology-processor:
    environment:
      SUPPRESS_ALERTS: false
      INTERDICTION_DESTINATION: global
      INTERDICTION_PRODUCER: interdiction-service-tp

  event-adjudicator:
    environment:
      SUPPRESS_ALERTS: false
      ALERTS_ONLY: false
      ALERT_DESTINATION: global
      ALERT_PRODUCER: investigation-service

  relay-service-ef:
    container_name: relay-service-ef
    build:
      context: https://github.com/tazama-lf/relay-service.git#${RELAY_BRANCH}
      args:
        - GH_TOKEN
      secrets:
        - GH_TOKEN
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    secrets:
      - GH_TOKEN
    command:
      - /bin/sh
      - -ec
      - 'export GH_TOKEN="$$(cat /run/secrets/GH_TOKEN)"; exec npm start'
    restart: always
    environment:
      FUNCTION_NAME: relay-service-ef
      CONSUMER_STREAM: interdiction-service-ef
      PRODUCER_STREAM: relay-service-nats-ef
      APM_SERVICE_NAME: relay-service-ef
    depends_on:
      - event-flow

  relay-service-tp:
    container_name: relay-service-tp
    build:
      context: https://github.com/tazama-lf/relay-service.git#${RELAY_BRANCH}
      args:
        - GH_TOKEN
      secrets:
        - GH_TOKEN
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    secrets:
      - GH_TOKEN
    command:
      - /bin/sh
      - -ec
      - 'export GH_TOKEN="$$(cat /run/secrets/GH_TOKEN)"; exec npm start'
    restart: always
    environment:
      FUNCTION_NAME: relay-service-tp
      CONSUMER_STREAM: interdiction-service-tp
      PRODUCER_STREAM: relay-service-nats-tp
      APM_SERVICE_NAME: relay-service-tp
    depends_on:
      - typology-processor

  relay-service-ea:
    container_name: relay-service-ea
    build:
      context: https://github.com/tazama-lf/relay-service.git#${RELAY_BRANCH}
      args:
        - GH_TOKEN
      secrets:
        - GH_TOKEN
    env_file:
      - env/relay-service-nats.env
      - .env
    volumes: *nats-client-volumes
    secrets:
      - GH_TOKEN
    command:
      - /bin/sh
      - -ec
      - 'export GH_TOKEN="$$(cat /run/secrets/GH_TOKEN)"; exec npm start'
    restart: always
    environment:
      FUNCTION_NAME: relay-service-ea
      CONSUMER_STREAM: investigation-service
      PRODUCER_STREAM: relay-service-nats-ea
      APM_SERVICE_NAME: relay-service-ea
    depends_on:
      - event-adjudicator

secrets:
  GH_TOKEN:
    environment: GH_TOKEN
