# Upstream credentials for the TLS-enabled core NATS broker.
x-nats-client-volumes: &nats-client-volumes
  - type: bind
    source: ${NATS_CERTS_DIR:-./nats/certs}/client
    target: /etc/nats/client
    read_only: true
    bind:
      create_host_path: false

services:
  nats-utilities:
    container_name: nats-utilities
    image: tazamaorg/nats-utilities:${TAZAMA_VERSION}
    env_file:
      - env/nats-utilities.env
      - .env
    volumes: *nats-client-volumes
    restart: always
    depends_on:
      - nats
    ports:
      - 4000:4000

secrets:
  GH_TOKEN:
    environment: GH_TOKEN